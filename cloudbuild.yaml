# Builds the container, pushes it to Artifact Registry, and deploys to Cloud Run.
# Run manually:  gcloud builds submit --project lesspane --config cloudbuild.yaml
# Or attach to a Cloud Build trigger on pushes to main.

# Dedicated deployer account (Run Admin, Artifact Registry Writer, Log Writer, Storage Object Viewer,
# and Service Account User on lesspane-run only). Requires the CLOUD_LOGGING_ONLY option below.
serviceAccount: projects/$PROJECT_ID/serviceAccounts/lesspane-build@$PROJECT_ID.iam.gserviceaccount.com

substitutions:
  _REGION: us-west1 # Oregon, closest region to Vancouver, WA
  _SERVICE: lesspane
  _REPO: lesspane

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID', '.']

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      # Runtime identity: Firestore access plus read access to its own secrets, nothing else.
      - --service-account=lesspane-run@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=3
      # "update" keeps any other env vars you set in the console (OWNER_EMAIL, EMAIL_FROM).
      - --update-env-vars=STORAGE=firestore,PROTOCOL_HEADER=x-forwarded-proto
      # No Resend account yet, so emails are logged. Once you have one, create the
      # lesspane-resend-api-key secret and append: ,RESEND_API_KEY=lesspane-resend-api-key:latest
      - --update-secrets=ADMIN_PASSWORD=lesspane-admin-password:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
