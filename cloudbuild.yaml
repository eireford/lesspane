# Tests, builds and deploys lesspane. See ../docs/conventions.md in the job-search hub.
#
# Triggers (us-west1, connection lesspane-github, repository lesspane):
#   lesspane-staging     push to main   staging, lesspane.net (the defaults below; the trigger also sets them)
#   lesspane-production  tag v*         overrides them for production (lesspane.com)
# `npm run deploy:staging` submits this file by hand, which also deploys staging.

# Dedicated deployer account (Run Admin, Artifact Registry Writer, Log Writer, Storage Object Viewer,
# and Service Account User on lesspane-run only). Requires the CLOUD_LOGGING_ONLY option below.
serviceAccount: projects/$PROJECT_ID/serviceAccounts/lesspane-build@$PROJECT_ID.iam.gserviceaccount.com

# Defaults are staging (lesspane.net), so a manual `gcloud builds submit` can only reach staging. The
# lesspane-production trigger (v* tags) overrides them: _SERVICE=lesspane, _APP_ENV=production,
# _FIRESTORE_DATABASE=(default), _ADMIN_SECRET=lesspane-admin-password, _SESSION_SECRET=lesspane-session-secret.
substitutions:
  _REGION: us-west1 # Oregon; Firestore databases are fixed to us-west1, so keep this here
  _SERVICE: lesspane-staging
  _REPO: lesspane
  _APP_ENV: staging
  _FIRESTORE_DATABASE: staging
  _ADMIN_SECRET: lesspane-staging-admin-password
  _SESSION_SECRET: lesspane-staging-session-secret
  # One image name for both environments; the tag (build ID) tells builds apart.
  _IMAGE_NAME: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/lesspane
  _IMAGE: ${_IMAGE_NAME}:${BUILD_ID}

steps:
  - id: test
    name: node:22-slim
    entrypoint: bash
    args: ['-c', 'npm ci --no-audit --no-fund && npm run check && npm test']

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}', '.']

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}
      - --region=${_REGION}
      # Runtime identity: Firestore, Vertex AI (the chat assistant) and read access to its own secrets, nothing else.
      - --service-account=lesspane-run@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=3
      # "update" keeps any other env vars you set in the console (OWNER_EMAIL, EMAIL_FROM).
      # GOOGLE_CLOUD_PROJECT: the chat assistant calls Gemini on Vertex AI in this project (lesspane-run has Vertex AI User).
      - --update-env-vars=STORAGE=firestore,PROTOCOL_HEADER=x-forwarded-proto,APP_ENV=${_APP_ENV},FIRESTORE_DATABASE=${_FIRESTORE_DATABASE},GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      # No Resend account yet, so emails are logged. Once you have one, create the
      # lesspane-resend-api-key secret and append: ,RESEND_API_KEY=lesspane-resend-api-key:latest
      # Google Workspace settings (GMAIL_USER, EMAIL_FROM, CALENDAR_ID, ADMIN_EMAILS, GOOGLE_CLIENT_ID and the
      # GOOGLE_CLIENT_SECRET secret) are set once per service and kept across deploys; see README "Google Workspace".
      - --update-secrets=ADMIN_PASSWORD=${_ADMIN_SECRET}:latest,SESSION_SECRET=${_SESSION_SECRET}:latest

  # Release builds (tag v*) also tag the deployed image(s) with the release; the registry's cleanup policy keeps
  # v-tagged images, so staging builds can never push the running production image out.
  - id: tag-release
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - >-
        if [ -n "$TAG_NAME" ]; then
        gcloud artifacts docker tags add ${_IMAGE_NAME}:${BUILD_ID} ${_IMAGE_NAME}:$TAG_NAME;
        else echo "Not a release build; nothing to tag."; fi

  - id: smoke-test
    name: curlimages/curl
    entrypoint: sh
    args:
      - -c
      - >-
        curl -fsS -o /dev/null https://${_SERVICE}-${PROJECT_NUMBER}.${_REGION}.run.app/ &&
        curl -fsS -o /dev/null https://${_SERVICE}-${PROJECT_NUMBER}.${_REGION}.run.app/quote

images:
  - ${_IMAGE}

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
